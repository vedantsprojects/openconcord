<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data: filesystem: writable:;
    worker-src 'self' blob: data: filesystem:;
    script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' blob: data: https:;
    font-src 'self' blob: data:;">
  <meta name="x-pwa-override-icons" content="true">
  <title>OpenConcord</title>
  <link rel="icon" type="image/png" href="/assets/icon.png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body style="margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
  user-dragging: none;
  -webkit-app-region: drag;
  height: 100vh;
  overflow: hidden;
  background: #2f3136;">
  <div id="app">
    <div class="app-background">
      <div class="bg-gradient-to-tr from-[#41464e] to-[#22272e]"></div>
      <div class="bg-[#2c2f33] shadow-lg"></div>
      <div class="fixed inset-0 bg-gradient-to-br from-[#34d399]/5 to-[#6366f1]/5"></div>
    </div>

    <!-- Header / Title Bar -->
    <div class="window-title-bar" style="position: fixed; top: 0; left: 0; width: 100%; height: 38px; background: #2f3136;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #202225;
    -webkit-app-region: drag;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #e07a5f;"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #f0932b;"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #48bfe1;"></div>
      </div>
      <div style="font-size: 11px; color: #9a9a9a;">OpenConcord</div>
      <div style="display: flex; gap: 6px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
      </div>
    </div>

    <!-- App Content -->
    <div style="margin-top: 38px; display: flex; height: calc(100vh - 38px);">
      <!-- Left Navigation Rail -->
      <div style="width: 72px; background: #1e1f22; position: relative;">
        <div style="height: 48px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #3ba55c 0%, #3ba55c 100%);"></div>
        </div>
      </div>

      <!-- Server Rail -->
      <div style="width: 56px; background: #1a1c1e; position: relative;">
        <div style="height: 32px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #121315;">
          <div style="width: 24px; height: 24px; border-radius: 50%; background: #3ba55c;"></div>
        </div>
        <div style="height: calc(100% - 32px);">
          <div style="height: 46px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #121315;">
            <div style="width: 48px; height: 32px; border-radius: 4px; background: rgba(255,255,255,0.05);"></div>
          </div>
          <div style="height: 46px; display: flex; align-items: center; justify-content: center;">
            <div style="width: 48px; height: 32px; border-radius: 4px; background: rgba(255,255,255,0.15);"></div>
          </div>
        </div>
      </div>

      <!-- Main Content Area -->
      <div style="flex: 1; display: flex; flex-direction: column;">
        <!-- Channels -->
        <div style="width: 240px; background: #2f3136; padding: 8px 8px 8px 12px;">
          <div style="font-size: 11px; font-weight: 700; color: #9a9a9a; margin-left: -8px; padding: 6px 8px;">Text Channels</div>
          <div style="margin-top: 8px;">
            <div style="padding: 6px 8px; border-radius: 4px; background: rgba(59, 165, 92, 0.2); color: #3ba55c; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;">
              <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #3ba55c;"></div>
              general
            </div>
            <div style="padding: 6px 8px; border-radius: 4px; font-size: 13px; color: #8e9297; display: flex; align-items: center; gap: 6px;">
              <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #8e9297; background: #414548;"></div>
              announcements
            </div>
            <div style="padding: 6px 8px; border-radius: 4px; font-size: 13px; color: #8e9297; display: flex; align-items: center; gap: 6px;">
              <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #8e9297; background: #414548;"></div>
              <span style="font-size: 13px;">random</span>
            </div>
          </div>
          <div style="margin-top: 8px;">
            <div style="padding: 6px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); color: #8e9297; font-size: 13px; display: flex; align-items: center; gap: 6px;">
              <div style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid #8e9297;"></div>
              <span style="font-size: 13px;">+ Add Channel</span>
            </div>
          </div>
        </div>

        <!-- Chat Area -->
        <div style="flex: 1; background: #35373c; display: flex; flex-direction: column;">
          <div style="flex: 1; padding: 20px; overflow-y: auto;">
            <div style="font-size: 12px; font-weight: 600; color: #8e9297; margin-bottom: 12px; text-transform: uppercase;">#general</div>
            <div style="margin-bottom: 16px;">
              <div style="text-align: right; margin-bottom: -8px;">
                <div style="font-size: 11px; color: #9a9a9a;">Admin</div>
                <div style="font-size: 11px; color: #b5bac1;">Today at 10:43 AM</div>
              </div>
              <div style="display: flex; gap: 8px; align-items: flex-start;">
                <div style="width: 36px; height: 36px; border-radius: 50%;"></div>
                <div style="background: #23a559; color: white; padding: 8px 14px; border-radius: 8px; font-size: 14px; line-height: 20px;">
                  Welcome to OpenConcord! This is a respectful, open-source alternative to Discord. 🚀
                </div>
              </div>
            </div>
          </div>
          <div style="padding: 16px; margin-right: 8px; position: sticky; bottom: 0;">
            <form onsubmit="event.preventDefault();" style="background: #202225; border-radius: 8px; padding: 8px; display: flex; align-items: center;">
              <div style="width: 32px; height: 34px; border-radius: 4px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 16px;">+</span>
              </div>
              <input type="text" style="flex: 1; background: transparent; border: none; color: white; outline: none; padding: 8px 12px; font-size: 14px;" placeholder="Message #general">
              <button style="width: 32px; height: 34px; border-radius: 4px; background: #3ba55c; border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <span style="font-size: 16px;">⬡</span>
              </button>
            </form>
          </div>
        </div>

        <!-- Right Panel (Servers + Users) -->
        <div style="width: 80px; background: #1e1f22;">
          <div style="height: 46px; border-bottom: 1px solid #121315; display: flex; align-items: center; justify-content: center;">
            <div style="width: 28px; height: 28px; border-radius: 50%; background: #5865f2;"></div>
          </div>
          <div style="padding: 8px;">
            <div style="width: 24px; height: 24px; border-radius: 4px; background: #23a559; margin-bottom: 8px;"></div>
            <div style="width: 24px; height: 24px; border-radius: 4px; background: rgba(255,255,255,0.1); margin-bottom: 8px;"></div>
            <div style="width: 24px; height: 24px; border-radius: 4px; background: rgba(255,255,255,0.1);"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
